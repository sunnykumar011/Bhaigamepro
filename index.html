<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bhai Game Pro</title>
<style>
body {
  margin: 0;
  text-align: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #141e30, #243b55);
  color: white;
}
h1 { color: yellow; }
p { font-size: 18px; }
#game {
  width: 90%;
  max-width: 500px;
  height: 350px;
  margin: 20px auto;
  background: white;
  border-radius: 15px;
  position: relative;
  overflow: hidden;
}
#box {
  width: 55px;
  height: 55px;
  background: #ff4081;
  border-radius: 12px;
  position: absolute;
  display: none;
  cursor: pointer;
}
button {
  padding: 12px 24px;
  background: yellow;
  border: 0;
  border-radius: 10px;
  font-size: 17px;
  cursor: pointer;
}
</style>
</head>
<body>

<h1>🎮 Bhai Game Pro</h1>
<p>30 second mein box pakdo!</p>
<p id="score">Score: 0</p>
<p id="high">🏆 High Score: 0</p>
<p id="time">Time: 30</p>

<div id="game">
  <div id="box"></div>
</div>

<button id="start" onclick="startGame()">Start / Restart</button>
<p id="message">Ready ho bhai? 😎</p>

<script>
let score = 0;
let time = 30;
let playing = false;
let timer;

let high = Number(localStorage.getItem("bhaiHigh") || 0);

const box = document.getElementById("box");
const game = document.getElementById("game");

document.getElementById("high").textContent =
  "🏆 High Score: " + high;

function moveBox() {
  const maxX = game.clientWidth - box.offsetWidth;
  const maxY = game.clientHeight - box.offsetHeight;

  box.style.left = Math.floor(Math.random() * (maxX + 1)) + "px";
  box.style.top = Math.floor(Math.random() * (maxY + 1)) + "px";

  const colors = [
    "#ff4081", "#00bcd4", "#4caf50",
    "#ff9800", "#9c27b0", "#f44336"
  ];

  box.style.background =
    colors[Math.floor(Math.random() * colors.length)];
}

function startGame() {
  clearInterval(timer);

  score = 0;
  time = 30;
  playing = true;

  document.getElementById("score").textContent = "Score: 0";
  document.getElementById("time").textContent = "Time: 30";
  document.getElementById("message").textContent = "Box pakdo! 🔥";

  box.style.display = "block";
  document.getElementById("start").textContent = "Restart Game";
  moveBox();

  timer = setInterval(function() {
    time--;
    document.getElementById("time").textContent = "Time: " + time;

    if (time <= 0) {
      clearInterval(timer);
      playing = false;
      box.style.display = "none";

      document.getElementById("message").textContent =
        "Game Over! Score: " + score + " 🎉";
    }
  }, 1000);
}

box.addEventListener("click", function() {
  if (!playing) return;

  score++;
  document.getElementById("score").textContent = "Score: " + score;

  if (score > high) {
    high = score;
    localStorage.setItem("bhaiHigh", high);
    document.getElementById("high").textContent =
      "🏆 High Score: " + high;
  }

  moveBox();
});
</script>

</body>
</html>
